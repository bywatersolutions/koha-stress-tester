# K6 Benchmark Helm Chart Values

# Image settings
image:
  repository: grafana/k6
  tag: latest
  pullPolicy: IfNotPresent

# Solr connection settings
solr:
  # Internal service URL (use FQDN for cross-namespace access)
  # Example: http://my-solr-service.solr-namespace.svc.cluster.local
  url: ""
  core: "grouped_works"
  
  # Credentials
  user: ""
  pass: ""
  # For K8s: use a secret for the password (more secure)
  # If existingSecret is set, password is read from the secret instead of pass
  existingSecret: ""      # Name of existing secret containing password
  existingSecretKey: "password"  # Key in secret for password

# Test configuration
test:
  # Staged load test parameters
  maxVUs: 300
  vuStep: 10
  rampTime: "5s"
  holdTime: "5s"

  # Think time between requests per VU iteration
  # "" = random (0 to 1s), "0"/"off"/"false"/"disabled" = none, or a number for fixed seconds
  thinkTime: ""

  # Request timeout
  timeout: "30s"

  # Stats collection interval (seconds)
  statsInterval: 10

# Word list for random search terms
# Will be mounted as /scripts/words.txt
wordlistFile: "words_sample.txt"

# Resource limits for k6 pod
resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "512Mi"

# Namespace to deploy into
namespace: k6-tests

# Job settings
backoffLimit: 0
ttlSecondsAfterFinished: 300  # Cleanup job 5 minutes after completion


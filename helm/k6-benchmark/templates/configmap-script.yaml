apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  script.js: |
    import http from "k6/http";
    import { check, sleep } from "k6";
    import { SharedArray } from "k6/data";
    import { Trend, Counter } from "k6/metrics";
    import exec from "k6/execution";
    import { textSummary } from "https://jslib.k6.io/k6-summary/0.0.1/index.js";

    // Configuration from environment (set via Helm values or secrets)
    const SOLR_URL = __ENV.SOLR_URL || "";
    const SOLR_CORE = __ENV.SOLR_CORE || "";
    const SOLR_USER = __ENV.SOLR_USER || "";
    const SOLR_PASS = __ENV.SOLR_PASS || "";
    const MAX_VUS = parseInt(__ENV.MAX_VUS) || {{ .Values.test.maxVUs }};
    const VU_STEP = parseInt(__ENV.VU_STEP) || {{ .Values.test.vuStep }};
    const RAMP_TIME = __ENV.RAMP_TIME || "{{ .Values.test.rampTime }}";
    const HOLD_TIME = __ENV.HOLD_TIME || "{{ .Values.test.holdTime }}";
    const TIMEOUT = __ENV.TIMEOUT || "{{ .Values.test.timeout }}";

    // Think time configuration
    const THINK_TIME_RAW = __ENV.THINK_TIME || "";
    const THINK_TIME_DISABLED = ["0", "off", "false", "disabled"].includes(THINK_TIME_RAW.toLowerCase());
    const THINK_TIME_FIXED = !THINK_TIME_DISABLED && THINK_TIME_RAW ? parseFloat(THINK_TIME_RAW) : null;

    function thinkTime(maxRandom) {
      if (THINK_TIME_DISABLED) {
        return;
      }
      if (THINK_TIME_FIXED !== null) {
        sleep(THINK_TIME_FIXED);
      } else {
        sleep(Math.random() * maxRandom);
      }
    }

    // Load words from file
    const words = new SharedArray("words", function() {
      return open("/scripts/words.txt").split(/\r?\n/).filter(w => w.trim());
    });

    // Custom metrics
    const solrQTime = new Trend("solr_qtime", true);

    // Store system info for final report
    let __solrSystemInfo = null;

    // Fetch Solr system info
    function fetchSolrSystemInfo() {
      try {
        const sysInfoUrl = `${SOLR_URL}/solr/admin/info/system?wt=json`;
        const res = http.get(sysInfoUrl, { headers, timeout: "10s" });
        if (res.status === 200) {
          return JSON.parse(res.body);
        }
      } catch (e) {
        return { error: `Could not fetch: ${e.message}` };
      }
      return null;
    }

    // Auth headers if needed
    const headers = {};
    if (SOLR_USER && SOLR_PASS) {
      const encoded = __ENV.K6_BROWSER ? btoa(`${SOLR_USER}:${SOLR_PASS}`) : 
        require("k6/encoding").b64encode(`${SOLR_USER}:${SOLR_PASS}`);
      headers["Authorization"] = `Basic ${encoded}`;
    }

    const params = {
      headers: headers,
      timeout: TIMEOUT,
    };

    // Generate stages dynamically
    function generateStages() {
      const stages = [];
      for (let vus = VU_STEP; vus <= MAX_VUS; vus += VU_STEP) {
        stages.push({ duration: RAMP_TIME, target: vus });
        stages.push({ duration: HOLD_TIME, target: vus });
      }
      stages.push({ duration: RAMP_TIME, target: 0 });
      return stages;
    }

    export const options = {
      stages: generateStages(),
      thresholds: {
        http_req_duration: [
          {
            threshold: "p(95)<2000",
            abortOnFail: true,
            delayAbortEval: "30s",
          },
        ],
        solr_qtime: ["p(95)<2000"],
      },
    };

    export function setup() {
      console.log(`========================================`);
      console.log(`K6 SOLR BENCHMARK (In-Cluster)`);
      console.log(`========================================`);
      console.log(`SOLR_URL: ${SOLR_URL}`);
      console.log(`SOLR_CORE: ${SOLR_CORE}`);
      console.log(`MAX_VUS: ${MAX_VUS}, VU_STEP: ${VU_STEP}`);
      console.log(`RAMP_TIME: ${RAMP_TIME}, HOLD_TIME: ${HOLD_TIME}`);
      console.log(`Word list: ${words.length} words`);
      console.log(`Aborts when p(95) response time exceeds 2s`);
      const thinkTimeStatus = THINK_TIME_DISABLED ? "disabled" : (THINK_TIME_FIXED !== null ? `${THINK_TIME_FIXED}s fixed` : "random");
      console.log(`THINK_TIME: ${thinkTimeStatus}`);
      
      // Fetch and display Solr system info
      const sysInfo = fetchSolrSystemInfo();
      if (sysInfo && !sysInfo.error) {
        console.log(`Solr version: ${sysInfo.lucene?.["solr-spec-version"] || "N/A"}`);
        console.log(`JVM memory max: ${sysInfo.jvm?.memory?.max || "N/A"}`);
        console.log(`Processors: ${sysInfo.jvm?.processors || "N/A"}`);
        console.log(`Mode: ${sysInfo.mode || "N/A"}`);
      }
      console.log(`========================================`);
    }

    export default function() {
      const word = words[Math.floor(Math.random() * words.length)];
      const queryUrl = `${SOLR_URL}/solr/${SOLR_CORE}/select?q=${encodeURIComponent(word)}&wt=json&rows=10`;
      
      const res = http.get(queryUrl, params);
      const vus = exec.instance.vusActive;
      const duration = res.timings.duration;

      // Log failures and slow queries
      if (res.status !== 200) {
        const failType = duration < 100 ? "CONN_FAIL" : "TIMEOUT";
        console.log(`${failType} [${vus} VUs] ${duration.toFixed(0)}ms - status=${res.status} error="${res.error || 'none'}" word="${word}"`);
      } else if (duration > 2000) {
        console.log(`SLOW [${vus} VUs] ${duration.toFixed(0)}ms - word="${word}"`);
      }

      // Extract Solr's QTime
      if (res.status === 200) {
        try {
          const body = JSON.parse(res.body);
          const qtime = body.responseHeader?.QTime || 0;
          solrQTime.add(qtime);
        } catch (e) {}
      }

      check(res, {
        "solr 200": (r) => r.status === 200,
        "response < 500ms": (r) => r.timings.duration < 500,
        "response < 1000ms": (r) => r.timings.duration < 1000,
        "response < 2000ms": (r) => r.timings.duration < 2000,
      });

      thinkTime(1);
    }

    export function teardown() {
      console.log(`========================================`);
      console.log(`TEST COMPLETE`);
      console.log(`========================================`);
      
      // Capture final Solr system info
      console.log(`Capturing Solr system info...`);
      __solrSystemInfo = fetchSolrSystemInfo();
      if (__solrSystemInfo && !__solrSystemInfo.error) {
        console.log(`  Load average: ${__solrSystemInfo.system?.systemLoadAverage || "N/A"}`);
        console.log(`  Memory used: ${__solrSystemInfo.jvm?.memory?.used || "N/A"}`);
      }
    }

    export function handleSummary(data) {
      // Fetch system info if not captured in teardown
      const solrSystemInfo = __solrSystemInfo || fetchSolrSystemInfo();
      
      const summary = {
        timestamp: new Date().toISOString(),
        config: {
          solr_url: SOLR_URL,
          solr_core: SOLR_CORE,
          max_vus: MAX_VUS,
          vu_step: VU_STEP,
          ramp_time: RAMP_TIME,
          hold_time: HOLD_TIME,
          thinkTime: THINK_TIME_DISABLED ? "disabled" : (THINK_TIME_FIXED !== null ? `${THINK_TIME_FIXED}s` : "random"),
        },
        metrics: data.metrics,
        solrSystem: solrSystemInfo,
      };
      // Write JSON to file (no escaping issues) and text summary to stdout
      return {
        stdout: textSummary(data, { indent: " ", enableColors: false }),
        "/tmp/summary.json": JSON.stringify(summary, null, 2),
      };
    }


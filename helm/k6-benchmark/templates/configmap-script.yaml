apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  script.js: |
    import http from "k6/http";
    import { check, sleep } from "k6";
    import { SharedArray } from "k6/data";
    import { Trend, Counter } from "k6/metrics";
    import exec from "k6/execution";

    // Configuration from environment
    const SOLR_URL = __ENV.SOLR_URL || "{{ .Values.solr.url }}";
    const SOLR_CORE = __ENV.SOLR_CORE || "{{ .Values.solr.core }}";
    const SOLR_USER = __ENV.SOLR_USER || "{{ .Values.solr.user }}";
    const SOLR_PASS = __ENV.SOLR_PASS || "{{ .Values.solr.pass }}";
    const MAX_VUS = parseInt(__ENV.MAX_VUS) || {{ .Values.test.maxVUs }};
    const VU_STEP = parseInt(__ENV.VU_STEP) || {{ .Values.test.vuStep }};
    const RAMP_TIME = __ENV.RAMP_TIME || "{{ .Values.test.rampTime }}";
    const HOLD_TIME = __ENV.HOLD_TIME || "{{ .Values.test.holdTime }}";
    const TIMEOUT = __ENV.TIMEOUT || "{{ .Values.test.timeout }}";

    // Load words from file
    const words = new SharedArray("words", function() {
      return open("/scripts/words.txt").split(/\r?\n/).filter(w => w.trim());
    });

    // Custom metrics
    const solrQTime = new Trend("solr_qtime", true);

    // Auth headers if needed
    const headers = {};
    if (SOLR_USER && SOLR_PASS) {
      const encoded = __ENV.K6_BROWSER ? btoa(`${SOLR_USER}:${SOLR_PASS}`) : 
        require("k6/encoding").b64encode(`${SOLR_USER}:${SOLR_PASS}`);
      headers["Authorization"] = `Basic ${encoded}`;
    }

    const params = {
      headers: headers,
      timeout: TIMEOUT,
    };

    // Generate stages dynamically
    function generateStages() {
      const stages = [];
      for (let vus = VU_STEP; vus <= MAX_VUS; vus += VU_STEP) {
        stages.push({ duration: RAMP_TIME, target: vus });
        stages.push({ duration: HOLD_TIME, target: vus });
      }
      stages.push({ duration: RAMP_TIME, target: 0 });
      return stages;
    }

    export const options = {
      stages: generateStages(),
      thresholds: {
        http_req_duration: [
          {
            threshold: "p(95)<2000",
            abortOnFail: true,
            delayAbortEval: "30s",
          },
        ],
        solr_qtime: ["p(95)<2000"],
      },
    };

    export function setup() {
      console.log(`========================================`);
      console.log(`K6 SOLR BENCHMARK (In-Cluster)`);
      console.log(`========================================`);
      console.log(`SOLR_URL: ${SOLR_URL}`);
      console.log(`SOLR_CORE: ${SOLR_CORE}`);
      console.log(`MAX_VUS: ${MAX_VUS}, VU_STEP: ${VU_STEP}`);
      console.log(`RAMP_TIME: ${RAMP_TIME}, HOLD_TIME: ${HOLD_TIME}`);
      console.log(`Word list: ${words.length} words`);
      console.log(`Aborts when p(95) response time exceeds 2s`);
      console.log(`========================================`);
    }

    export default function() {
      const word = words[Math.floor(Math.random() * words.length)];
      const queryUrl = `${SOLR_URL}/solr/${SOLR_CORE}/select?q=${encodeURIComponent(word)}&wt=json&rows=10`;
      
      const res = http.get(queryUrl, params);
      const vus = exec.instance.vusActive;
      const duration = res.timings.duration;

      // Log failures and slow queries
      if (res.status !== 200) {
        const failType = duration < 100 ? "CONN_FAIL" : "TIMEOUT";
        console.log(`${failType} [${vus} VUs] ${duration.toFixed(0)}ms - status=${res.status} error="${res.error || 'none'}" word="${word}"`);
      } else if (duration > 2000) {
        console.log(`SLOW [${vus} VUs] ${duration.toFixed(0)}ms - word="${word}"`);
      }

      // Extract Solr's QTime
      if (res.status === 200) {
        try {
          const body = JSON.parse(res.body);
          const qtime = body.responseHeader?.QTime || 0;
          solrQTime.add(qtime);
        } catch (e) {}
      }

      check(res, {
        "solr 200": (r) => r.status === 200,
        "response < 500ms": (r) => r.timings.duration < 500,
        "response < 1000ms": (r) => r.timings.duration < 1000,
        "response < 2000ms": (r) => r.timings.duration < 2000,
      });
    }

    export function teardown() {
      console.log(`========================================`);
      console.log(`TEST COMPLETE`);
      console.log(`========================================`);
    }


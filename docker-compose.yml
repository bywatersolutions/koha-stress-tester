services:
  k6:
    image: grafana/k6:${K6_IMAGE_TAG}
    # For HTTP-only tests, you can use: user: "${UID}:${GID}"
    # For browser tests, comment out the user line (runs as root)
    user: "${UID}:${GID}"
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./benchmarks:/scripts:ro
      - ./output:/output
    entrypoint: /bin/sh
    command:
      - -c
      - |
        export TEST_NUMBER=$$(printf "%03d" $$(($$(ls -1 /output/*.json 2>/dev/null | wc -l) + 1)))
        echo "Test number: $$TEST_NUMBER"
        k6 run /scripts/${BENCH}
